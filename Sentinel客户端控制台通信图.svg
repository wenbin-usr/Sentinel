<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1060" viewBox="0 0 1560 1060" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="0.5" stop-color="#eef2f7"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#99f6e4" stop-opacity="0.45"/><stop offset="1" stop-color="#99f6e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.45"/><stop offset="1" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gClient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="gDash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="gBrowser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/><stop offset="0.5" stop-color="#4f46e5"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrGn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrBl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
    <marker id="arrOr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="arrPk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
  </defs>

  <rect width="1560" height="1060" fill="url(#bgGrad)"/>
  <rect width="1560" height="1060" fill="url(#glow1)"/>
  <rect width="1560" height="1060" fill="url(#glow2)"/>
  <g stroke="#cbd5e1" stroke-width="0.5" opacity="0.5"><path d="M0 200 H1560 M0 400 H1560 M0 600 H1560 M0 800 H1560 M0 1000 H1560"/></g>

  <!-- 标题 -->
  <text x="780" y="52" text-anchor="middle" font-size="34" font-weight="800" fill="url(#titleGrad)">Sentinel 客户端 ↔ 控制台 HTTP 通信架构图</text>
  <text x="780" y="80" text-anchor="middle" font-size="14" fill="#475569">心跳注册 · 监控拉取 · 规则下发/回查 · 基于 CommandCenter(:8719) + @CommandMapping SPI</text>
  <line x1="500" y1="94" x2="1060" y2="94" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>

  <!-- ============ 客户端面板 ============ -->
  <rect x="40" y="108" width="460" height="762" rx="16" fill="#f0fdfa" opacity="0.7" stroke="#5eead4" stroke-width="1"/>
  <path d="M56 108 H484 a16 16 0 0 1 16 16 V152 H40 V124 a16 16 0 0 1 16 -16 Z" fill="url(#gClient)"/>
  <text x="60" y="136" font-size="16" font-weight="700" fill="#fff">① Sentinel 客户端 · 业务应用进程</text>
  <text x="60" y="172" font-size="10.5" fill="#0f766e">sentinel-transport · SPI 三实现 netty-http / simple-http / spring-mvc</text>

  <!-- C1 业务应用 -->
  <g filter="url(#shadow)">
    <rect x="60" y="188" width="420" height="56" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
    <rect x="60" y="188" width="5" height="56" rx="2" fill="#0d9488"/>
    <text x="78" y="210" font-size="13" font-weight="700" fill="#0f766e">业务应用 · SphU.entry()</text>
    <text x="78" y="228" font-size="8.5" fill="#475569">InitFunc SPI 启动传输层: HeartbeatSenderInitFunc(@InitOrder -1) · CommandCenterInitFunc</text>
  </g>
  <!-- C2 HeartbeatSender -->
  <g filter="url(#shadow)">
    <rect x="60" y="254" width="420" height="72" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
    <rect x="60" y="254" width="5" height="72" rx="2" fill="#0d9488"/>
    <text x="78" y="274" font-size="13" font-weight="700" fill="#0f766e">HeartbeatSender 心跳发送器 → 出口</text>
    <text x="78" y="291" font-size="8.5" fill="#475569">SPI: HttpHeartbeatSender · SpringMvcHttpHeartbeatSender · SimpleHttpHeartbeatSender</text>
    <text x="78" y="305" font-size="8.5" fill="#475569">初始延迟 5s · 默认 5s(simple 10s) · payload: app/ip/port/v/version/hostname/pid</text>
    <text x="78" y="319" font-size="8.5" fill="#475569">可配 csp.sentinel.heartbeat.interval.ms</text>
  </g>
  <!-- C3 CommandCenter -->
  <g filter="url(#shadow)">
    <rect x="60" y="336" width="420" height="66" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
    <rect x="60" y="336" width="5" height="66" rx="2" fill="#0d9488"/>
    <text x="78" y="356" font-size="13" font-weight="700" fill="#0f766e">CommandCenter 命令服务器 ← 入口 (:8719)</text>
    <text x="78" y="373" font-size="8.5" fill="#475569">客户端内嵌 HTTP 服务 · 默认端口 8719 · 占用每 3 次失败 +1 自动递增 → setRuntimePort</text>
    <text x="78" y="387" font-size="8.5" fill="#475569">SPI: NettyHttpCommandCenter / SimpleHttpCommandCenter / SpringMvcHttpCommandCenter</text>
  </g>
  <!-- C4 CommandHandlerProvider -->
  <g filter="url(#shadow)">
    <rect x="60" y="412" width="420" height="44" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
    <rect x="60" y="412" width="5" height="44" rx="2" fill="#0d9488"/>
    <text x="78" y="432" font-size="13" font-weight="700" fill="#0f766e">CommandHandlerProvider</text>
    <text x="78" y="449" font-size="8.5" fill="#475569">@CommandMapping 注解 + SPI 发现 · HTTP 路径(去 /) 即命令名</text>
  </g>
  <!-- C5 Handler 表 -->
  <g filter="url(#shadow)">
    <rect x="60" y="466" width="420" height="128" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
    <rect x="60" y="466" width="5" height="128" rx="2" fill="#0d9488"/>
    <text x="78" y="486" font-size="13" font-weight="700" fill="#0f766e">Command Handler 命令表</text>
    <g font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="8" fill="#334155">
      <text x="78" y="503">getRules     → FetchActiveRuleCommandHandler  <tspan fill="#64748b">type=flow|degrade|system|authority</tspan></text>
      <text x="78" y="518">setRules     → ModifyRulesCommandHandler      <tspan fill="#64748b">type=&amp;data=</tspan></text>
      <text x="78" y="533">metric       → SendMetricCommandHandler       <tspan fill="#64748b">startTime/endTime (MetricSearcher)</tspan></text>
      <text x="78" y="548">jsonTree     → FetchJsonTreeCommandHandler</text>
      <text x="78" y="563">clusterNode  → FetchSimpleClusterNodeCommandHandler</text>
      <text x="78" y="578">version / api → 版本号 / 列出全部命令</text>
    </g>
  </g>
  <!-- C6 Metric -->
  <g filter="url(#shadow)">
    <rect x="60" y="604" width="420" height="62" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
    <rect x="60" y="604" width="5" height="62" rx="2" fill="#0d9488"/>
    <text x="78" y="624" font-size="13" font-weight="700" fill="#0f766e">MetricWriter → 指标日志</text>
    <text x="78" y="641" font-size="8.5" fill="#475569">本地 metrics.log.{pid} 文件 (sentinel-core)</text>
    <text x="78" y="655" font-size="8.5" fill="#475569">MetricSearcher 由 metric 命令按时间区间读取并返回 (监控为拉取模型)</text>
  </g>
  <!-- C7 TransportConfig -->
  <g filter="url(#shadow)">
    <rect x="60" y="676" width="420" height="74" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
    <rect x="60" y="676" width="5" height="74" rx="2" fill="#0d9488"/>
    <text x="78" y="696" font-size="13" font-weight="700" fill="#0f766e">TransportConfig 配置 (-D)</text>
    <text x="78" y="713" font-size="8.5" fill="#475569">csp.sentinel.dashboard.server  (控制台地址, 可逗号分隔多台)</text>
    <text x="78" y="727" font-size="8.5" fill="#475569">csp.sentinel.api.port=8719 · heartbeat.interval.ms · heartbeat.client.ip</text>
    <text x="78" y="741" font-size="8.5" fill="#475569">csp.sentinel.heartbeat.api.path (默认 /registry/machine)</text>
  </g>
  <text x="270" y="822" text-anchor="middle" font-size="9.5" fill="#0f766e" opacity="0.85">↑ 出口 = 心跳发送器 · ↓ 入口 = CommandCenter(:8719) → @CommandMapping</text>

  <!-- ============ 控制台面板 ============ -->
  <rect x="1060" y="108" width="460" height="762" rx="16" fill="#eef2ff" opacity="0.7" stroke="#a5b4fc" stroke-width="1"/>
  <path d="M1076 108 H1504 a16 16 0 0 1 16 16 V152 H1060 V124 a16 16 0 0 1 16 -16 Z" fill="url(#gDash)"/>
  <text x="1080" y="136" font-size="16" font-weight="700" fill="#fff">② Sentinel Dashboard · Spring Boot</text>
  <text x="1080" y="172" font-size="10.5" fill="#3730a3">sentinel-dashboard · 浏览器 REST + 主动调用客户端 CommandCenter</text>

  <!-- D1 MachineRegistryController -->
  <g filter="url(#shadow)">
    <rect x="1080" y="188" width="420" height="62" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="1080" y="188" width="5" height="62" rx="2" fill="#4f46e5"/>
    <text x="1098" y="208" font-size="13" font-weight="700" fill="#3730a3">MachineRegistryController ← 心跳入口</text>
    <text x="1098" y="225" font-size="8.5" fill="#475569">@RequestMapping /registry/machine (接收 GET/POST)</text>
    <text x="1098" y="239" font-size="8.5" fill="#475569">构建 MachineInfo → appManagement.addMachine(刷新 lastHeartbeat)</text>
  </g>
  <!-- D2 注册表 -->
  <g filter="url(#shadow)">
    <rect x="1080" y="260" width="420" height="74" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="1080" y="260" width="5" height="74" rx="2" fill="#4f46e5"/>
    <text x="1098" y="280" font-size="13" font-weight="700" fill="#3730a3">AppManagement · SimpleMachineDiscovery</text>
    <text x="1098" y="297" font-size="8.5" fill="#475569">内存注册表 ConcurrentMap&lt;app, AppInfo&gt; · MachineInfo.isHealthy/isDead</text>
    <text x="1098" y="311" font-size="8.5" fill="#475569">心跳超时判定 · MetricFetcher 定期清理 dead 机器/应用</text>
    <text x="1098" y="325" font-size="8.5" fill="#475569">isValidMachineOfApp 作为所有规则控制器的访问守卫</text>
  </g>
  <!-- D3 MetricFetcher -->
  <g filter="url(#shadow)">
    <rect x="1080" y="344" width="420" height="66" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="1080" y="344" width="5" height="66" rx="2" fill="#4f46e5"/>
    <text x="1098" y="364" font-size="13" font-weight="700" fill="#3730a3">MetricFetcher (@Component · 定时 1s)</text>
    <text x="1098" y="381" font-size="8.5" fill="#475569">ScheduledExecutor fetchAllApp() · 对每台健康机器</text>
    <text x="1098" y="395" font-size="8.5" fill="#475569">GET /metric?startTime&amp;endTime · MetricNode.fromThinString 解析聚合</text>
  </g>
  <!-- D4 Repository -->
  <g filter="url(#shadow)">
    <rect x="1080" y="420" width="420" height="54" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="1080" y="420" width="5" height="54" rx="2" fill="#4f46e5"/>
    <text x="1098" y="440" font-size="13" font-weight="700" fill="#3730a3">InMemoryMetricsRepository</text>
    <text x="1098" y="457" font-size="8.5" fill="#475569">三级 Map: app→resource→timestamp · MAX_METRIC_LIVE_TIME_MS 5min 自动淘汰</text>
  </g>
  <!-- D5 SentinelApiClient -->
  <g filter="url(#shadow)">
    <rect x="1080" y="484" width="420" height="70" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
    <rect x="1080" y="484" width="5" height="70" rx="2" fill="#4f46e5"/>
    <text x="1098" y="504" font-size="13" font-weight="700" fill="#3730a3">SentinelApiClient → 命令出口 (桥接)</text>
    <text x="1098" y="521" font-size="8.5" fill="#475569">CloseableHttpAsyncClient · 返回 CompletableFuture&lt;String&gt;</text>
    <text x="1098" y="535" font-size="8.5" fill="#475569">fetchXxxOfMachine(GET) · setXxxOfMachine(POST, 客户端 ≥1.6.0) · 版本探测</text>
    <text x="1098" y="549" font-size="8.5" fill="#475569">fetchResource/ClusterNode · gateway/* · cluster/* 透传命令名</text>
  </g>
  <!-- D6 Provider/Publisher -->
  <g filter="url(#shadow)">
    <rect x="1080" y="564" width="420" height="66" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="1080" y="564" width="5" height="66" rx="2" fill="#4f46e5"/>
    <text x="1098" y="584" font-size="13" font-weight="700" fill="#3730a3">FlowRuleApiProvider / FlowRuleApiPublisher</text>
    <text x="1098" y="601" font-size="8.5" fill="#475569">仅 flow 规则有 (FlowControllerV2) · 其余规则控制器直连 SentinelApiClient</text>
    <text x="1098" y="615" font-size="8.5" fill="#475569">Provider 取最健康一台回查 · Publisher 遍历应用全部机器下发</text>
  </g>
  <!-- D7 REST Controllers -->
  <g filter="url(#shadow)">
    <rect x="1080" y="640" width="420" height="104" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="1080" y="640" width="5" height="104" rx="2" fill="#4f46e5"/>
    <text x="1098" y="660" font-size="13" font-weight="700" fill="#3730a3">REST Controllers (浏览器侧)</text>
    <text x="1098" y="678" font-size="8.5" fill="#475569">/app · /metric · /resource · /version · /registry</text>
    <text x="1098" y="692" font-size="8.5" fill="#475569">/v1·/v2/flow · /degrade · /authority · /system</text>
    <text x="1098" y="706" font-size="8.5" fill="#475569">/paramFlow · /gateway/* · /cluster/*</text>
    <text x="1098" y="724" font-size="8.5" fill="#64748b" font-style="italic">浏览器 CRUD → 调 SentinelApiClient → 客户端 CommandCenter</text>
  </g>
  <text x="1290" y="822" text-anchor="middle" font-size="9.5" fill="#3730a3" opacity="0.85">↑ 控制台主动发起: 监控拉取 / 规则回查与下发 / 资源树</text>

  <!-- ============ 中部 HTTP 通信箭头 ============ -->
  <!-- 箭头线(先画, 药丸后画覆盖中段) -->
  <g fill="none" stroke-width="2">
    <path d="M505 250 L1055 250" stroke="#059669" marker-end="url(#arrGn)"/>
    <path d="M1055 365 L505 365" stroke="#0284c7" marker-end="url(#arrBl)"/>
    <path d="M1055 480 L505 480" stroke="#0284c7" marker-end="url(#arrBl)"/>
    <path d="M1055 595 L505 595" stroke="#d97706" marker-end="url(#arrOr)"/>
    <path d="M1055 710 L505 710" stroke="#0284c7" marker-end="url(#arrBl)"/>
    <path d="M1055 815 L505 815" stroke="#0284c7" marker-end="url(#arrBl)"/>
  </g>

  <!-- 药丸标签 -->
  <!-- 1 心跳 -->
  <g filter="url(#shadow)">
    <rect x="590" y="227" width="380" height="46" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <rect x="590" y="227" width="5" height="46" rx="2" fill="#059669"/>
    <text x="612" y="246" font-size="12.5" font-weight="700"><tspan fill="#059669">GET</tspan><tspan fill="#0f172a">  /registry/machine</tspan><tspan fill="#64748b" font-weight="400">   (simple-http 为 POST)</tspan></text>
    <text x="612" y="263" font-size="9.5" fill="#64748b">① 心跳上报 · 注册 MachineInfo · 默认 5s (simple 10s)</text>
  </g>
  <!-- 2 监控拉取 -->
  <g filter="url(#shadow)">
    <rect x="590" y="342" width="380" height="46" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="590" y="342" width="5" height="46" rx="2" fill="#0284c7"/>
    <text x="612" y="361" font-size="12.5" font-weight="700"><tspan fill="#0284c7">GET</tspan><tspan fill="#0f172a">  /metric?startTime=&amp;endTime=</tspan></text>
    <text x="612" y="378" font-size="9.5" fill="#64748b">② MetricFetcher 定时拉取监控 (1s) · 读客户端本地指标日志</text>
  </g>
  <!-- 3 规则回查 -->
  <g filter="url(#shadow)">
    <rect x="590" y="457" width="380" height="46" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="590" y="457" width="5" height="46" rx="2" fill="#0284c7"/>
    <text x="612" y="476" font-size="12.5" font-weight="700"><tspan fill="#0284c7">GET</tspan><tspan fill="#0f172a">  /getRules?type=flow|degrade|system|authority</tspan></text>
    <text x="612" y="493" font-size="9.5" fill="#64748b">③ 回查规则用于 UI 展示 (SentinelApiClient.fetchXxx)</text>
  </g>
  <!-- 4 规则下发 -->
  <g filter="url(#shadow)">
    <rect x="590" y="572" width="380" height="46" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <rect x="590" y="572" width="5" height="46" rx="2" fill="#d97706"/>
    <text x="612" y="591" font-size="12.5" font-weight="700"><tspan fill="#d97706">POST</tspan><tspan fill="#0f172a">  /setRules?type=&amp;data=</tspan></text>
    <text x="612" y="608" font-size="9.5" fill="#64748b">④ 下发规则 (客户端 ≥1.6.0 用 POST, 否则 GET · ModifyRulesCommandHandler)</text>
  </g>
  <!-- 5 资源树 -->
  <g filter="url(#shadow)">
    <rect x="590" y="687" width="380" height="46" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="590" y="687" width="5" height="46" rx="2" fill="#0284c7"/>
    <text x="612" y="706" font-size="12.5" font-weight="700"><tspan fill="#0284c7">GET</tspan><tspan fill="#0f172a">  /jsonTree  ·  /clusterNode</tspan></text>
    <text x="612" y="723" font-size="9.5" fill="#64748b">⑤ 实时资源树 / 调用链节点 (实时监控页)</text>
  </g>
  <!-- 6 其他命令 -->
  <g filter="url(#shadow)">
    <rect x="590" y="792" width="380" height="46" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="590" y="792" width="5" height="46" rx="2" fill="#0284c7"/>
    <text x="612" y="811" font-size="12.5" font-weight="700"><tspan fill="#0284c7">GET</tspan><tspan fill="#0f172a">  getParamFlowRules · gateway/* · cluster/*</tspan></text>
    <text x="612" y="828" font-size="9.5" fill="#64748b">⑥ 热点参数 / 网关 / 集群限流 (各模块 SPI 注册的命令)</text>
  </g>

  <!-- ============ 浏览器 ============ -->
  <g filter="url(#shadow)">
    <rect x="1060" y="886" width="460" height="62" rx="12" fill="url(#gBrowser)"/>
    <text x="1290" y="912" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">③ 浏览器 / 前端控制台</text>
    <text x="1290" y="932" text-anchor="middle" font-size="10.5" fill="#ffe4e6">规则编辑 · 实时监控曲线 · 机器列表 · 集群分配</text>
  </g>
  <!-- 浏览器 -> 控制台 REST -->
  <path d="M1290 886 L1290 744" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#arrPk)" stroke-dasharray="5,3"/>
  <text x="1300" y="860" font-size="9.5" fill="#be123c">HTTP REST (JSON)</text>

  <!-- ============ 图例 ============ -->
  <rect x="40" y="966" width="1480" height="80" rx="12" fill="#f8fafc" opacity="0.92" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="988" font-size="13" font-weight="700" fill="#334155">图例 / Legend</text>
  <rect x="60" y="1002" width="18" height="14" rx="3" fill="url(#gClient)"/><text x="84" y="1013" font-size="11" fill="#334155">客户端</text>
